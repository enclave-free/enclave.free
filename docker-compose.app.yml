services:
  core-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enclave-core-backend
    expose:
      - "8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-intfloat/multilingual-e5-base}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - LLM_PROVIDER=${LLM_PROVIDER:-sage}
      - LLM_API_URL=${LLM_API_URL:-http://tinfoil-proxy:8089/v1}
      - LLM_API_KEY=${TINFOIL_API_KEY:-}
      - LLM_MODEL=${TINFOIL_MODEL:-kimi-k2-5}
      - SAGE_WEB_URL=http://sage:3000
      - SEARXNG_URL=http://searxng:8080
      - SQLITE_PATH=/data/sanctum.db
      - INTERNAL_AGENT_TOKEN=${INTERNAL_AGENT_TOKEN:-dev-internal-agent-token}
      # Magic Link Auth configuration
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - MOCK_EMAIL=${MOCK_EMAIL:-true}
      # SMTP configuration (optional, not needed if MOCK_EMAIL=true)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-Sanctum <noreply@localhost>}
      # Simulation settings for development/testing
      - SIMULATE_USER_AUTH=${SIMULATE_USER_AUTH:-false}
      - SIMULATE_ADMIN_AUTH=${SIMULATE_ADMIN_AUTH:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      qdrant:
        condition: service_healthy
      tinfoil-proxy:
        condition: service_healthy
      searxng:
        condition: service_healthy
    volumes:
      - ./backend/app:/app
      - ./uploads:/uploads
      - embedding_cache:/root/.cache/huggingface
      - sqlite_data:/data
    networks:
      - sanctum-net

  sage:
    build:
      context: ./runtime/sage
      dockerfile: Dockerfile
    container_name: enclave-sage-web
    command: ["/app/enclave_web"]
    expose:
      - "3000"
    volumes:
      - sage_workspace:/workspace
    environment:
      - DATABASE_URL=postgres://sage:sage@postgres:5432/sage
      - TINFOIL_API_URL=http://tinfoil-proxy:8089/v1
      - TINFOIL_API_KEY=${TINFOIL_API_KEY}
      - TINFOIL_MODEL=${TINFOIL_MODEL:-kimi-k2-5}
      - TINFOIL_EMBEDDING_MODEL=${TINFOIL_EMBEDDING_MODEL:-nomic-embed-text}
      - SAGE_WORKSPACE=/workspace
      - ENCLAVE_WEB_PORT=3000
      - ENCLAVE_BACKEND_URL=http://core-backend:8000
      - INTERNAL_AGENT_TOKEN=${INTERNAL_AGENT_TOKEN:-dev-internal-agent-token}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - SEARXNG_URL=http://searxng:8080
      - USER_SESSION_COOKIE_NAME=${USER_SESSION_COOKIE_NAME:-sanctum_session}
      - ADMIN_SESSION_COOKIE_NAME=${ADMIN_SESSION_COOKIE_NAME:-sanctum_admin_session}
      - CSRF_COOKIE_NAME=${CSRF_COOKIE_NAME:-sanctum_csrf}
      - RUST_LOG=${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      tinfoil-proxy:
        condition: service_healthy
      core-backend:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sanctum-net

  backend:
    image: nginx:1.27-alpine
    container_name: enclave-api-gateway
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      core-backend:
        condition: service_healthy
      sage:
        condition: service_healthy
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sanctum-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sanctum-frontend
    ports:
      - "127.0.0.1:5173:5173"
    dns:
      - 127.0.0.11  # Docker's embedded DNS server
    dns_opt:
      - attempts:3
      - timeout:2
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - sanctum-net

volumes:
  embedding_cache:
  sqlite_data:
  sage_workspace:

networks:
  sanctum-net:
    driver: bridge
