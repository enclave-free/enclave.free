services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: enclave-sage-postgres
    environment:
      POSTGRES_USER: sage
      POSTGRES_PASSWORD: sage
      POSTGRES_DB: sage
    volumes:
      - sage_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sage -d sage"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - enclave-net

  tinfoil-proxy:
    image: ghcr.io/tinfoilsh/tinfoil-proxy:0.1.6
    container_name: enclave-tinfoil-proxy
    command:
      - -e
      - ${TINFOIL_ROUTER_HOST:-inference.tinfoil.sh}
      - -r
      - ${TINFOIL_ROUTER_REPO:-tinfoilsh/confidential-model-router}
      - -p
      - "8089"
      - -b
      - 0.0.0.0
      - --allowed-host
      - tinfoil-proxy
    environment:
      - TINFOIL_API_KEY=${LLM_API_KEY:?LLM_API_KEY is required}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/v1/models >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - enclave-net

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: enclave-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - enclave-net

  searxng:
    image: searxng/searxng:latest
    container_name: enclave-searxng
    volumes:
      - ./searxng:/etc/searxng:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - enclave-net

  valkey:
    image: valkey/valkey:8-alpine
    container_name: enclave-valkey
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - enclave-net

volumes:
  qdrant_data:
  sage_postgres_data:

networks:
  enclave-net:
    driver: bridge
