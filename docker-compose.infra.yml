services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: enclave-sage-postgres
    environment:
      POSTGRES_USER: sage
      POSTGRES_PASSWORD: sage
      POSTGRES_DB: sage
    volumes:
      - sage_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sage -d sage"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sanctum-net

  tinfoil-proxy:
    image: ghcr.io/tinfoilsh/tinfoil-cli:latest
    container_name: enclave-tinfoil-proxy
    command:
      - proxy
      - -e
      - ${TINFOIL_ROUTER_HOST:-inference.tinfoil.sh}
      - -r
      - ${TINFOIL_ROUTER_REPO:-tinfoilsh/confidential-model-router}
      - -p
      - "8089"
      - -b
      - 0.0.0.0
    environment:
      - TINFOIL_API_KEY=${TINFOIL_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/v1/models >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - sanctum-net

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: sanctum-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - sanctum-net

  searxng:
    image: searxng/searxng:latest
    container_name: sanctum-searxng
    volumes:
      - ./searxng:/etc/searxng:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sanctum-net

volumes:
  qdrant_data:
  sage_postgres_data:

networks:
  sanctum-net:
    driver: bridge
