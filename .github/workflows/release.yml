name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must look like v0.1.0; got: $tag" >&2
            exit 1
          fi

          version="${tag#v}"
          version_file="$(tr -d '[:space:]' < VERSION)"
          if [[ "$version" != "$version_file" ]]; then
            echo "Tag $tag does not match VERSION=$version_file" >&2
            exit 1
          fi

          frontend_version="$(node -p "require('./frontend/package.json').version")"
          if [[ "$version" != "$frontend_version" ]]; then
            echo "Tag $tag does not match frontend/package.json version=$frontend_version" >&2
            exit 1
          fi

          lock_version="$(node -p "require('./frontend/package-lock.json').version")"
          if [[ "$version" != "$lock_version" ]]; then
            echo "Tag $tag does not match frontend/package-lock.json version=$lock_version" >&2
            exit 1
          fi

          lock_package_version="$(node -p "require('./frontend/package-lock.json').packages[''].version")"
          if [[ "$version" != "$lock_package_version" ]]; then
            echo "Tag $tag does not match frontend/package-lock.json root package version=$lock_package_version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          previous_tag="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"

          {
            echo "# Enclave Free ${version}"
            echo
            echo "Customer-facing beta/demo release checkpoint."
            echo
            echo "## Release Inputs"
            echo
            echo "- Version: \`${version}\`"
            echo "- Tag: \`${tag}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Operator handoff: \`docs/demo-deployment-handoff.md\`"
            echo
            echo "## Changes"
            echo

            if [[ -n "$previous_tag" ]]; then
              git log --no-merges --pretty='- %s (%h)' "${previous_tag}..${tag}"
            else
              echo "- First tagged release for this repository."
              echo
              echo "Recent commits included in this checkpoint:"
              git log --no-merges --pretty='- %s (%h)' -20 "${tag}"
            fi
          } > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Enclave Free ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --verify-tag
