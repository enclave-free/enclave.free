name: Security regression

on:
  pull_request:
  push:
    branches:
      - staging
      - main

permissions:
  contents: read
  security-events: write

jobs:
  backend-security-regression:
    name: Backend security regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Run backend security regression suite
        run: |
          python -m unittest \
            backend.tests.test_magic_link_enumeration \
            backend.tests.test_ingest_batch_replacement \
            backend.tests.test_query_retrieval_hydration \
            backend.tests.test_sql_safety \
            backend.tests.test_rate_limit \
            backend.tests.test_deployment_config_rate_limits \
            backend.tests.test_operational_readiness_docs \
            backend.tests.test_browser_storage_posture_docs \
            backend.tests.test_retention_run_policy_docs \
            backend.tests.test_conversation_retention_docs \
            backend.tests.test_data_classification_and_input_validation \
            backend.tests.test_admin_db_query_endpoint \
            backend.tests.test_lifecycle_status

  frontend-security-regression:
    name: Frontend security regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run safe rendering and admin/user security UI tests
        run: |
          npm test -- --run \
            src/components/chat/ChatMessage.test.tsx \
            src/pages/AdminDeploymentConfig.test.tsx \
            src/pages/UserAuth.test.tsx

  dependency-and-sast-scans:
    name: Dependency and SAST scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install scan tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit semgrep
      - name: Python dependency scan
        run: pip-audit -r backend/requirements.txt
      - name: Frontend dependency scan
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Semgrep SAST scan
        run: semgrep scan --config p/owasp-top-ten --config p/python --config p/typescript --sarif --output semgrep.sarif
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
