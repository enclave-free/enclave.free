name: Security regression

on:
  pull_request:
  push:
    branches:
      - staging
      - main

permissions:
  contents: read
  security-events: write

jobs:
  backend-security-regression:
    name: Backend security regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Run backend security regression suite
        run: |
          python -m unittest \
            backend.tests.test_magic_link_enumeration \
            backend.tests.test_ingest_batch_replacement \
            backend.tests.test_query_retrieval_hydration \
            backend.tests.test_sql_safety \
            backend.tests.test_rate_limit \
            backend.tests.test_deployment_config_rate_limits \
            backend.tests.test_operational_readiness_docs \
            backend.tests.test_browser_storage_posture_docs \
            backend.tests.test_retention_run_policy_docs \
            backend.tests.test_conversation_retention_docs \
            backend.tests.test_data_classification_and_input_validation \
            backend.tests.test_admin_db_query_endpoint \
            backend.tests.test_lifecycle_status

  frontend-security-regression:
    name: Frontend security regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run safe rendering and admin/user security UI tests
        run: |
          npm test -- --run \
            src/components/chat/ChatMessage.test.tsx \
            src/pages/AdminDeploymentConfig.test.tsx \
            src/pages/UserAuth.test.tsx

  dependency-and-sast-scans:
    name: Dependency and SAST scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install scan tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit semgrep
      - name: Python dependency scan
        run: |
          ignore_vulns=(
            --ignore-vuln GHSA-69w3-r845-3855 # EX-001: accepted risk for constrained transitive dependency; tracked in https://github.com/enclave-free/enclave.free-prototype/issues/196
            --ignore-vuln PYSEC-2024-277 # EX-002: accepted risk for constrained transitive dependency; tracked in https://github.com/enclave-free/enclave.free-prototype/issues/196
            --ignore-vuln PYSEC-2025-183 # EX-003: accepted risk for constrained transitive dependency; tracked in https://github.com/enclave-free/enclave.free-prototype/issues/196
            --ignore-vuln PYSEC-2025-189 # EX-004: accepted risk for constrained transitive dependency; tracked in https://github.com/enclave-free/enclave.free-prototype/issues/196
            --ignore-vuln PYSEC-2025-190 # EX-005: accepted risk for constrained transitive dependency; tracked in https://github.com/enclave-free/enclave.free-prototype/issues/196
            --ignore-vuln PYSEC-2025-191 # EX-006: accepted risk for constrained transitive dependency; tracked in https://github.com/enclave-free/enclave.free-prototype/issues/196
            --ignore-vuln PYSEC-2025-192 # EX-007: accepted risk for constrained transitive dependency; tracked in https://github.com/enclave-free/enclave.free-prototype/issues/196
            --ignore-vuln PYSEC-2025-193 # EX-008: accepted risk for constrained transitive dependency; tracked in https://github.com/enclave-free/enclave.free-prototype/issues/196
            --ignore-vuln PYSEC-2025-194 # EX-009: accepted risk for constrained transitive dependency; tracked in https://github.com/enclave-free/enclave.free-prototype/issues/196
            --ignore-vuln PYSEC-2025-195 # EX-010: accepted risk for constrained transitive dependency; tracked in https://github.com/enclave-free/enclave.free-prototype/issues/196
            --ignore-vuln PYSEC-2025-196 # EX-011: accepted risk for constrained transitive dependency; tracked in https://github.com/enclave-free/enclave.free-prototype/issues/196
            --ignore-vuln PYSEC-2025-197 # EX-012: accepted risk for constrained transitive dependency; tracked in https://github.com/enclave-free/enclave.free-prototype/issues/196
            --ignore-vuln PYSEC-2025-210 # EX-013: accepted risk for constrained transitive dependency; tracked in https://github.com/enclave-free/enclave.free-prototype/issues/196
            --ignore-vuln PYSEC-2025-211 # EX-014: accepted risk for constrained transitive dependency; tracked in https://github.com/enclave-free/enclave.free-prototype/issues/196
            --ignore-vuln PYSEC-2025-212 # EX-015: accepted risk for constrained transitive dependency; tracked in https://github.com/enclave-free/enclave.free-prototype/issues/196
            --ignore-vuln PYSEC-2025-213 # EX-016: accepted risk for constrained transitive dependency; tracked in https://github.com/enclave-free/enclave.free-prototype/issues/196
            --ignore-vuln PYSEC-2025-214 # EX-017: accepted risk for constrained transitive dependency; tracked in https://github.com/enclave-free/enclave.free-prototype/issues/196
            --ignore-vuln PYSEC-2025-215 # EX-018: accepted risk for constrained transitive dependency; tracked in https://github.com/enclave-free/enclave.free-prototype/issues/196
            --ignore-vuln PYSEC-2025-216 # EX-019: accepted risk for constrained transitive dependency; tracked in https://github.com/enclave-free/enclave.free-prototype/issues/196
            --ignore-vuln PYSEC-2025-217 # EX-020: accepted risk for constrained transitive dependency; tracked in https://github.com/enclave-free/enclave.free-prototype/issues/196
            --ignore-vuln PYSEC-2025-218 # EX-021: accepted risk for constrained transitive dependency; tracked in https://github.com/enclave-free/enclave.free-prototype/issues/196
            --ignore-vuln PYSEC-2026-139 # EX-022: accepted risk for constrained transitive dependency; tracked in https://github.com/enclave-free/enclave.free-prototype/issues/196
          )
          pip-audit -r backend/requirements.txt "${ignore_vulns[@]}"
      - name: Frontend dependency scan
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Semgrep SAST scan
        run: semgrep scan --config p/owasp-top-ten --config p/python --config p/typescript --sarif --output semgrep.sarif
      - name: Check Semgrep SARIF output
        id: semgrep-sarif
        if: always()
        run: |
          if [ -s semgrep.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Semgrep SARIF
        if: always() && steps.semgrep-sarif.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
